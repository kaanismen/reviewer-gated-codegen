# Tek çalıştırma yolu:  docker compose up
#
# .env dosyası ZORUNLU DEĞİLDİR. Yoksa aşağıdaki değişkenler boş kalır ve
# sistem replay sağlayıcısıyla açılır (PROJECT.md §3.3, anahtarsız çalışabilirlik).
# Compose, varsa proje kökündeki .env dosyasını değişken ikamesi için
# kendiliğinden okur; env_file bildirimi kullanılmaz çünkü eski Compose
# sürümlerinde eksik dosya hata verir.

services:
  atolye:
    build: .
    image: gtech-agent-atolyesi:1.0
    ports:
      # 127.0.0.1'e bağlanır, 0.0.0.0'a DEĞİL. Arayüz artık API anahtarı
      # kabul ettiği için (§6/T8) servisin yerel ağdaki başka makinelerden
      # erişilebilir olmaması gerekir.
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Kontrol limitleri (PROJECT.md §5) — boş bırakılırsa varsayılan.
      # Demo sırasında hata senaryosunu ucuza göstermek için MAX_TUR=2
      # gibi değerler buradan verilebilir.
      MAX_TUR: ${MAX_TUR:-}
      MAX_MALIYET_USD: ${MAX_MALIYET_USD:-}
      MAX_TOKEN_TOPLAM: ${MAX_TOKEN_TOPLAM:-}
      MAX_SURE_SN: ${MAX_SURE_SN:-}
      # Rol bazlı sağlayıcı ve model geçersiz kılma (PROJECT.md §8.1).
      # Genel LLM_PROVIDER yukarıda; bunlar rol bazında onu ezer.
      LLM_PROVIDER_PLANLAYICI: ${LLM_PROVIDER_PLANLAYICI:-}
      LLM_PROVIDER_UYGULAYICI: ${LLM_PROVIDER_UYGULAYICI:-}
      LLM_PROVIDER_DENETLEYICI: ${LLM_PROVIDER_DENETLEYICI:-}
      MODEL_PLANLAYICI: ${MODEL_PLANLAYICI:-}
      MODEL_UYGULAYICI: ${MODEL_UYGULAYICI:-}
      MODEL_DENETLEYICI: ${MODEL_DENETLEYICI:-}
      # Gerçek çağrılar kasede yazılsın mı (tests/cassettes/)
      LLM_KAYIT: ${LLM_KAYIT:-}
    volumes:
      # Kayıt modunda üretilen kasetler hostta kalıcı olmalı.
      - ./tests/cassettes:/app/tests/cassettes
      # Üretilen oyunlar konteyner kapansa da hosttan incelenebilir kalır.
      - ./workspaces:/workspaces
    extra_hosts:
      # Linux'ta host.docker.internal tanımlı değildir; Ollama host'ta
      # çalışırken erişilebilsin diye açıkça eşlenir.
      - "host.docker.internal:host-gateway"

  # Testler:  docker compose run --rm test
  #
  # Ayrı bir servis çünkü tests/ imaja girmez (.dockerignore) — üretim imajı
  # yalın kalsın diye. Test koşusunda proje /app üzerine bağlanır.
  # profiles, "docker compose up" ile birlikte başlamasını engeller.
  test:
    build: .
    image: gtech-agent-atolyesi:1.0
    profiles: ["test"]
    volumes:
      - .:/app
    command: ["python", "-m", "pytest"]
